<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بتسامحني؟ 🙃</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05020a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* إطار الهاتف */
    .phone {
      position: relative;
      width: min(100%, 430px);
      height: min(96vh, 880px);
      aspect-ratio: 9 / 19.5;
      max-height: 96vh;
      overflow: hidden;
      border: 8px solid #15151b;
      border-radius: 38px;
      background: #000;
      box-shadow:
        0 0 0 2px #30303a,
        0 22px 70px rgba(0,0,0,.65);
    }

    .screen {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    /* الصورة الأولى */
    #firstImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* طبقة ناعمة فوق الصورة حتى يكون النص واضحاً */
    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          rgba(0,0,0,.48) 0%,
          rgba(0,0,0,.08) 35%,
          rgba(0,0,0,.08) 62%,
          rgba(0,0,0,.42) 100%);
      pointer-events: none;
    }

    .question-box {
      position: absolute;
      top: 50%;
      left: 7%;
      right: 7%;
      transform: translateY(-50%);
      text-align: center;
      z-index: 5;
    }

    .question {
      margin: 0;
      color: #fff;
      font-size: clamp(27px, 8vw, 42px);
      font-weight: 800;
      line-height: 1.25;
      text-shadow: 0 3px 14px rgba(0,0,0,.8);
    }

    .buttons-area {
      position: absolute;
      left: 8%;
      right: 8%;
      top: calc(50% + 85px);
      height: 150px;
      z-index: 10;
    }

    button {
      position: absolute;
      border: 0;
      min-width: 105px;
      padding: 14px 25px;
      border-radius: 999px;
      font-size: 20px;
      font-weight: 800;
      color: white;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 8px 22px rgba(0,0,0,.35);
      transition: transform .12s ease, left .16s ease, top .16s ease;
    }

    #yes {
      left: calc(50% - 65px);
      top: 50%;
      transform: translate(-100%, -50%);
      background: linear-gradient(135deg, #ff4f8b, #e91e63);
    }

    #no {
      left: calc(50% + 10px);
      top: 50%;
      transform: translate(0, -50%);
      background: linear-gradient(135deg, #4d5566, #252936);
    }

    #no:hover { transform: translate(0, -50%) scale(1.04); }

    /* الشاشة الثانية */
    #success {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
      z-index: 30;
    }

    #success img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .success-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.15), transparent 45%, rgba(0,0,0,.2));
      pointer-events: none;
    }

    .tap-note {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 5%;
      text-align: center;
      color: rgba(255,255,255,.9);
      font-size: 13px;
      text-shadow: 0 2px 8px #000;
    }

    @media (max-width: 430px) {
      body { padding: 0; }
      .phone {
        width: 100vw;
        height: 100vh;
        max-height: none;
        border-width: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>

<body>
  <main class="phone" aria-label="صفحة اعتذار">
    <section class="screen" id="mainScreen">
      <img id="firstImage" src="IMG_5838.jpeg" alt="">
      <div class="shade"></div>

      <div class="question-box">
        <h1 class="question">بتسامحني؟ 🙃</h1>
      </div>

      <div class="buttons-area" id="buttonsArea">
        <button id="yes" type="button">نعم ❤️</button>
        <button id="no" type="button">لا 🙃</button>
      </div>

      <section id="success">
        <img src="335E0DDC-7C30-4A44-A269-4D29F3C860AC.png" alt="">
        <div class="success-shade"></div>
      </section>

      <audio id="music" preload="auto" src="ssstik.io_1790866451227.mp3"></audio>
    </section>
  </main>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const area = document.getElementById("buttonsArea");
    const success = document.getElementById("success");
    const music = document.getElementById("music");

    function moveNoButton() {
      const padding = 4;
      const maxX = Math.max(padding, area.clientWidth - noBtn.offsetWidth - padding);
      const maxY = Math.max(padding, area.clientHeight - noBtn.offsetHeight - padding);

      // مكان عشوائي جديد داخل إطار الهاتف/منطقة الأزرار
      const x = padding + Math.random() * (maxX - padding);
      const y = padding + Math.random() * (maxY - padding);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.transform = "none";
    }

    // يعمل مع اللمس على الهاتف ومع الماوس على الكمبيوتر.
    noBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener("click", async () => {
      // فتح الصورة الثانية فوراً
      success.style.display = "block";

      // يبدأ الصوت بعد ضغطة المستخدم، لذلك يسمح المتصفح بتشغيله.
      try {
        music.currentTime = 0;
        await music.play();
      } catch (err) {
        // إذا منع المتصفح التشغيل، تبقى الصورة الثانية ظاهرة.
        console.log("Audio playback was blocked:", err);
      }
    });

    // عند تغيير حجم الشاشة، إذا كان زر "لا" قد تحرك، نضمن بقاءه داخل الإطار.
    window.addEventListener("resize", () => {
      if (noBtn.style.left) {
        const maxX = Math.max(4, area.clientWidth - noBtn.offsetWidth - 4);
        const maxY = Math.max(4, area.clientHeight - noBtn.offsetHeight - 4);
        const x = Math.min(parseFloat(noBtn.style.left) || 4, maxX);
        const y = Math.min(parseFloat(noBtn.style.top) || 4, maxY);
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
      }
    });
  </script>
</body>
</html>
